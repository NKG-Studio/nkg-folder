[package]
name = "nkg-virtual-folder"
version = "0.1.0"
edition = "2024"
description = "A virtual-first, dockable Windows file workspace"
license = "MIT"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_dock = { version = "0.20.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
trash = "5"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
clipboard-win = { version = "5.4", features = ["std"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.31"
